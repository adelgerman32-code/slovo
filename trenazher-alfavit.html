<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: алфавит — Слово</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4E6; --cream-deep:#F3E8D2; --ink:#2B211A; --ink-soft:#5A4E40;
    --green:#2B5941; --green-deep:#1E3F2D; --gold:#C99A3D; --gold-light:#E8C876;
    --brick:#9C2B2B; --line:#DCCBA5; --bad:#9C2B2B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'PT Sans', sans-serif;line-height:1.6;}
  h1,h2{font-family:'PT Serif', serif;font-weight:700;color:var(--green-deep);}
  a{color:var(--green);}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;}

  header{padding:24px 0;border-bottom:1px solid var(--line);}
  header .inner{max-width:640px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'PT Serif', serif;font-size:20px;font-weight:700;color:var(--green-deep);display:flex;align-items:center;gap:8px;text-decoration:none;}
  .brand svg{width:26px;height:26px;}

  .crumbs{padding:20px 0 0;font-size:14px;color:var(--ink-soft);}
  .crumbs a{color:var(--ink-soft);text-decoration:none;}
  .crumbs a:hover{text-decoration:underline;}
  .crumbs span{color:var(--ink);}

  main{padding:28px 0 64px;}
  .progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .progress-row h1{font-size:20px;}
  .progress-row .count{font-size:14px;color:var(--ink-soft);}
  .en-title{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:20px;}
  .bar{height:6px;background:var(--cream-deep);border-radius:3px;overflow:hidden;margin-bottom:28px;}
  .bar-fill{height:100%;background:var(--gold);transition:width .3s;}

  .card{
    background:var(--cream-deep);
    border:1px solid var(--line);
    border-radius:4px;
    padding:28px;
    text-align:center;
  }
  .q-label{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .big-letter{
    font-family:'PT Serif',serif;
    font-size:72px;
    font-weight:700;
    color:var(--green-deep);
    margin-bottom:24px;
  }

  .options{display:flex;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .opt{
    flex:1;
    min-width:140px;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:var(--cream);
    font-family:'PT Sans',sans-serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .opt:hover{border-color:var(--green);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--green);border-color:var(--green);color:var(--cream);}
  .opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--cream);}
  .opt.dim{opacity:0.5;}

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:4px;
    font-size:15px;
    display:none;
    text-align:left;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(43,89,65,0.12);color:var(--green-deep);}
  .feedback.bad{background:rgba(156,43,43,0.1);color:var(--bad);}

  .next-row{margin-top:20px;text-align:right;}
  .btn{
    display:inline-block;
    padding:11px 22px;
    border-radius:2px;
    font-weight:700;
    font-size:15px;
    background:var(--green);
    color:var(--cream);
    border:none;
    cursor:pointer;
    font-family:'PT Sans',sans-serif;
    visibility:hidden;
  }
  .btn.show{visibility:visible;}

  .result{text-align:center;padding:40px 0;}
  .result .score{font-family:'PT Serif',serif;font-size:52px;color:var(--green-deep);margin-bottom:10px;}
  .result p{color:var(--ink-soft);font-size:16px;margin-bottom:24px;}
  .result-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn-outline{
    display:inline-block;padding:11px 22px;border-radius:2px;font-weight:700;font-size:15px;
    border:1.5px solid var(--green);color:var(--green);background:transparent;text-decoration:none;
  }

  footer{padding:28px 0;text-align:center;color:var(--ink-soft);font-size:14px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <div class="inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#2B5941" stroke-width="1.5"/><path d="M13 26V14L20 20L27 14V26" stroke="#2B5941" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Слово
    </a>
  </div>
</header>

<div class="wrap crumbs">
  <a href="index.html">Главная</a> · <a href="a1.html">А1</a> · <a href="lesson1-alfavit.html">Урок 1</a> · <span>Тренажёр</span>
</div>

<main class="wrap">

  <div id="quiz-area">
    <div class="progress-row">
      <h1>Гласная или согласная?</h1>
      <div class="count" id="count">1 из 31</div>
    </div>
    <div class="en-title">Vowel or consonant?</div>
    <div class="bar"><div class="bar-fill" id="bar-fill" style="width:3.2%"></div></div>

    <div class="card">
      <div class="q-label">Какая это буква?</div>
      <div class="big-letter" id="letter"></div>
      <div class="options">
        <button class="opt" id="opt-vowel" onclick="answer(true)">Гласная<br><span style="font-weight:400;font-size:12px;">vowel</span></button>
        <button class="opt" id="opt-consonant" onclick="answer(false)">Согласная<br><span style="font-weight:400;font-size:12px;">consonant</span></button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="next-row">
        <button class="btn" id="next-btn" onclick="next()">Далее →</button>
      </div>
    </div>
  </div>

  <div class="result" id="result-area" style="display:none;">
    <div class="score" id="score-text"></div>
    <p id="score-comment"></p>
    <div class="result-actions">
      <button class="btn-outline" onclick="restart()">Пройти ещё раз</button>
      <a class="btn" href="lesson1-alfavit.html" style="text-decoration:none;">К теории</a>
    </div>
  </div>

</main>

<footer>
  Портал «Слово» · русский язык и РКИ
</footer>

<script>
const questions = [
  { letter: "А", isVowel: true },
  { letter: "Б", isVowel: false },
  { letter: "В", isVowel: false },
  { letter: "Г", isVowel: false },
  { letter: "Д", isVowel: false },
  { letter: "Е", isVowel: true },
  { letter: "Ё", isVowel: true },
  { letter: "Ж", isVowel: false },
  { letter: "З", isVowel: false },
  { letter: "И", isVowel: true },
  { letter: "Й", isVowel: false },
  { letter: "К", isVowel: false },
  { letter: "Л", isVowel: false },
  { letter: "М", isVowel: false },
  { letter: "Н", isVowel: false },
  { letter: "О", isVowel: true },
  { letter: "П", isVowel: false },
  { letter: "Р", isVowel: false },
  { letter: "С", isVowel: false },
  { letter: "Т", isVowel: false },
  { letter: "У", isVowel: true },
  { letter: "Ф", isVowel: false },
  { letter: "Х", isVowel: false },
  { letter: "Ц", isVowel: false },
  { letter: "Ч", isVowel: false },
  { letter: "Ш", isVowel: false },
  { letter: "Щ", isVowel: false },
  { letter: "Ы", isVowel: true },
  { letter: "Э", isVowel: true },
  { letter: "Ю", isVowel: true },
  { letter: "Я", isVowel: true }
];

let current = 0;
let score = 0;
let answered = false;

function render(){
  const q = questions[current];
  document.getElementById('letter').textContent = q.letter;
  document.getElementById('count').textContent = (current+1) + ' из ' + questions.length;
  document.getElementById('bar-fill').style.width = ((current+1)/questions.length*100) + '%';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').classList.remove('show');
  const v = document.getElementById('opt-vowel');
  const c = document.getElementById('opt-consonant');
  [v, c].forEach(b => { b.disabled = false; b.className = 'opt'; });
  answered = false;
}

function answer(choseVowel){
  if (answered) return;
  answered = true;
  const q = questions[current];
  const correct = q.isVowel;
  const v = document.getElementById('opt-vowel');
  const c = document.getElementById('opt-consonant');
  v.disabled = true; c.disabled = true;

  const chosenBtn = choseVowel ? v : c;
  const otherBtn = choseVowel ? c : v;
  const isRight = (choseVowel === correct);

  if (isRight){
    chosenBtn.classList.add('correct');
    otherBtn.classList.add('dim');
    score++;
  } else {
    chosenBtn.classList.add('wrong');
    otherBtn.classList.add('correct');
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isRight ? 'ok' : 'bad');
  const ruWord = correct ? 'гласная' : 'согласная';
  const enWord = correct ? 'a vowel' : 'a consonant';
  fb.innerHTML = (isRight ? 'Верно! ' : 'Не совсем. ') + 'Буква «' + q.letter + '» — ' + ruWord + '. <br><span style="color:var(--ink-soft);font-style:italic;">The letter "' + q.letter + '" is ' + enWord + '.</span>';

  document.getElementById('next-btn').classList.add('show');
}

function next(){
  if (!answered) return;
  current++;
  if (current >= questions.length){
    showResult();
  } else {
    render();
  }
}

function showResult(){
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('score-text').textContent = score + ' / ' + questions.length;
  let comment = 'Повтори буквы ещё раз — и всё получится. / Review the letters again — you\'ll get there.';
  if (score === questions.length) comment = 'Отлично! Все буквы верно. / Perfect! All letters correct.';
  else if (score >= questions.length - 2) comment = 'Почти идеально! / Almost perfect!';
  document.getElementById('score-comment').textContent = comment;
}

function restart(){
  current = 0; score = 0;
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
}

render();
</script>

</body>
</html>
